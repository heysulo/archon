apiVersion: apps/v1
kind: Deployment
metadata:
  name: archon-portal
  labels:
    app: archon-portal
spec:
  # Any number: the registry ranks one primary and the rest as mirrors, and every replica serves
  replicas: 2
  selector:
    matchLabels:
      app: archon-portal
  template:
    metadata:
      labels:
        app: archon-portal
    spec:
      containers:
      - name: archon-portal
        image: 10.21.3.30:80/archon-portal:latest
        imagePullPolicy: Always
        env:
        - name: ARCHON_REGISTRY_LOCATIONS
          value: "10.21.3.201|10.21.3.202|10.21.3.203"
        # Joins through the database, so it needs no fingerprint or token; see archon-registry/k8s/tls.yaml
        - name: ARCHON_TLS
          valueFrom:
            configMapKeyRef:
              name: archon-tls
              key: mode
        - name: PORTAL_PORT
          value: "8080"
        # Serves HTTPS with this certificate chain and PKCS#8 key. Created by hand, never committed, for example a
        # self-signed one for the portal's address:
        #   openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out tls.key
        #   openssl req -x509 -new -key tls.key -out tls.crt -days 365 -subj "/CN=Archon Portal" \
        #     -addext "subjectAltName=IP:10.21.3.204" -addext "extendedKeyUsage=serverAuth"
        #   kubectl create secret tls archon-portal-tls --cert=tls.crt --key=tls.key
        - name: PORTAL_TLS_CERT
          value: "/etc/portal-tls/tls.crt"
        - name: PORTAL_TLS_KEY
          value: "/etc/portal-tls/tls.key"
        # Users and sessions live in the archon schema, through the same login as the registry
        - name: ARCHON_DB_URL
          value: "jdbc:mysql://mysql.heysulo.internal:3306/archon"
        - name: ARCHON_DB_USER
          valueFrom:
            secretKeyRef:
              name: archon-db
              key: username
        - name: ARCHON_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: archon-db
              key: password
        # Where this replica runs, shown on the portal
        - name: ARCHON_ADVERTISED_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: ARCHON_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - containerPort: 8080
          name: https
        # Healthy whenever the portal serves, even while the registries fail over. The kubelet does not check the
        # certificate, so a self-signed one is fine here.
        readinessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
        # The certificate and key from the archon-portal-tls Secret. Kubernetes updates the files in place when the
        # Secret changes, and the portal picks a renewed certificate up within a minute.
        volumeMounts:
        - name: tls
          mountPath: /etc/portal-tls
          readOnly: true
      volumes:
      - name: tls
        secret:
          secretName: archon-portal-tls
---
# Reachable by anyone who can reach https://10.21.3.204; every page with data needs a portal sign-in.
apiVersion: v1
kind: Service
metadata:
  name: archon-portal
spec:
  type: LoadBalancer
  loadBalancerIP: 10.21.3.204
  selector:
    app: archon-portal
  ports:
  - name: https
    protocol: TCP
    port: 443
    targetPort: https
