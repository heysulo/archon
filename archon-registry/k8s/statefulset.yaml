apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: archon-registry
  labels:
    app: archon-registry
spec:
  serviceName: "archon-registry"
  replicas: 3
  selector:
    matchLabels:
      app: archon-registry
  template:
    metadata:
      labels:
        app: archon-registry
    spec:
      containers:
      - name: archon-registry
        image: 10.21.3.30:80/archon-registry:latest
        imagePullPolicy: Always
        env:
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: ARCHON_REGISTRY_LOCATIONS
          value: "10.21.3.201|10.21.3.202|10.21.3.203"
        # Shown on the portal, with the pod name from HOSTNAME
        - name: ARCHON_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: ARCHON_DB_URL
          value: "jdbc:mysql://mysql.heysulo.internal:3306/archon"
        # Created by hand, never committed:
        #   kubectl create secret generic archon-db --from-literal=username=... --from-literal=password=...
        - name: ARCHON_DB_USER
          valueFrom:
            secretKeyRef:
              name: archon-db
              key: username
        - name: ARCHON_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: archon-db
              key: password
        command: ["/bin/sh", "-c"]
        args:
          - |
            ORDINAL=${MY_POD_NAME##*-}
            MY_IP=$(echo $ARCHON_REGISTRY_LOCATIONS | awk -F'|' -v idx=$((ORDINAL+1)) '{print $idx}')
            export MY_EXTERNAL_IP=$MY_IP
            echo "Pod configured with External IP: $MY_EXTERNAL_IP"
            # exec: Java replaces the shell as process 1, so it receives the SIGTERM Kubernetes sends on stop.
            # Without it the shell ignores the signal and the pod is killed only after the grace period.
            exec java -jar app.jar
        ports:
        - containerPort: 8080
          name: web
