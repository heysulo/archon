apiVersion: v1
kind: Service
metadata:
  name: archon-registry-0-svc
spec:
  # Registries and applications reach registries through these whatever their readiness: an unready registry
  # may be mid-election, and dropping it would stall the election. Readiness only paces rollouts.
  publishNotReadyAddresses: true
  type: LoadBalancer
  loadBalancerIP: 10.21.3.201
  selector:
    statefulset.kubernetes.io/pod-name: archon-registry-0
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
